  function renderQ() {

  }
  function sentEl(it, filled) {

    }));
  }
  const blankSay = it => it.segs.map(x => x.t === 'x' ? x.v : 'なに').join('');

  /* ---- あなうめ ---- */
  function renderFill(q) {

      h('div', { class: 'stage' }, h('div', { class: 'pic' }, q.it.e), h('div', { id: 'sentBox' }, sentEl(q.it, q.filled))),
      h('div', { class: 'tray', id: 'tray' }, q.choices.map(p => h('button', { type: 'button', class: 'ptile' + (p.length > 1 ? ' small' : ''), 'data-p': p, style: '--c:' + PCOLOR[p] }, p)))
    ]);
    $('#tray').addEventListener('pointerdown', e => onDown(e, '.ptile'));
    $('#sentBox').addEventListener('click', onSlotTap);
    if (st.readQ) sayQ();
  }
  function slots() { return $$('#sentBox .slot'); }
  function openSlots() { return slots().filter(s => !s.classList.contains('ok')); }
  function dropFill(p, slotEl, tileEl, clone, r) {
    const q = G.q, bi = +slotEl.dataset.bi, b = q.it.blanks[bi];
    const ok = b.ok.indexOf(p) >= 0;
    if (!ok) {
      q.miss++; G.miss++; sfx.ng();
      slotEl.classList.remove('ng'); void slotEl.offsetWidth; slotEl.classList.add('ng');
      const wrongTxt = q.it.segs.map((x, i) => x.t === 'x' ? x.v : (q.it.blanks.indexOf(x) === bi ? p : (q.filled[q.it.blanks.indexOf(x)] || 'なに'))).join('');
      speak(wrongTxt + '？ ちょっと へんだね。もういちど');
      hintCheck();
      return back(clone, tileEl, r);
    }
    const sr = slotEl.getBoundingClientRect();
    flyTo(clone, r, sr, () => {
      q.filled[bi] = p;
      slotEl.classList.add('ok'); slotEl.style.setProperty('--c', PCOLOR[p]); slotEl.textContent = p;
      tileEl.classList.remove('used');   // カードは もどす（おなじ じょしを もう1かい つかう ことが ある）
      sfx.ok(q.filled.filter(Boolean).length);
      $$('.ptile.hint, .slot.hint').forEach(x => x.classList.remove('hint'));
      if (q.filled.every(Boolean)) qDone(slotEl);
    });
  }
  function onSlotTap(e) {
    const s = e.target.closest('.slot'); if (!s || s.classList.contains('ok') || !G.sel || G.busy) return;
    const tile = $('.ptile[data-p="' + G.sel + '"]'); clearSel(); if (!tile) return;
    const m = makeClone(tile); dropFill(tile.dataset.p, s, tile, m.c, m.r);
  }
  function hintCheck() {
    const q = G.q; if (st.hint === 'none') return;
    if (q.miss >= (st.hint === 'after1' ? 1 : 2)) {
      if (q.mode === 'fill') { const bi = q.filled.findIndex(f => !f); const ans = q.it.blanks[bi].ans; const t = $('.ptile[data-p="' + ans + '"]'); if (t) t.classList.add('hint'); const s = slots()[bi]; if (s) s.classList.add('hint'); }
      else if (q.mode === 'order') { const c = q.cards.find(c => !c.extra && !c.placed && c === nextNeeded(q)); if (c) { const el = $('.wcard[data-cid="' + c.cid + '"]'); if (el) el.classList.add('hint'); } }
      else { const el = $('.opt[data-ok="1"]'); if (el) el.classList.add('hint'); }
    }
  }

  /* ---- ドラッグ（あなうめ・ならべかえ） ---- */
  let drag = null;
  function makeClone(el) {
    const r = el.getBoundingClientRect(), c = el.cloneNode(true);
    c.classList.remove('sel', 'hint', 'shake'); c.classList.add('float');
    c.style.left = r.left + 'px'; c.style.top = r.top + 'px'; c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
    document.body.appendChild(c); el.classList.add('used');
    return { c, r };
  }
  function flyTo(c, r, tr, done) {
    c.style.transition = 'transform .28s cubic-bezier(.4,0,.6,1)';
    requestAnimationFrame(() => { c.style.transform = 'translate(' + (tr.left + tr.width / 2 - r.left - r.width / 2) + 'px,' + (tr.top + tr.height / 2 - r.top - r.height / 2) + 'px) scale(.8)'; });
    setTimeout(() => { c.remove(); done(); }, 290);
  }
  function back(c, el, r) {
    c.style.transition = 'transform .26s cubic-bezier(.3,1.4,.5,1)';
    requestAnimationFrame(() => { c.style.transform = 'none'; });
    setTimeout(() => { c.remove(); el.classList.remove('used'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }, 270);
  }
  function targetsFor() { return G.q.mode === 'fill' ? openSlots() : $$('#ansRow .oslot'); }
  function targetAt(x, y) { return targetsFor().find(t => { const r = t.getBoundingClientRect(); return x >= r.left - 22 && x <= r.right + 22 && y >= r.top - 26 && y <= r.bottom + 26; }) || null; }
  function onDown(e, sel) {
    const el = e.target.closest(sel); if (!el || el.classList.contains('used') || drag || G.busy) return;
    e.preventDefault();
    drag = { el, x0: e.clientX, y0: e.clientY, id: e.pointerId, moved: false };
    window.addEventListener('pointermove', onMove, { passive: false }); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
  }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.id) return; e.preventDefault();
    const x = e.clientX, y = e.clientY;
    if (!drag.moved) { if (Math.hypot(x - drag.x0, y - drag.y0) < 8) return; drag.moved = true; const m = makeClone(drag.el); drag.c = m.c; drag.r = m.r; clearSel(); sfx.pick(); if (G.q.mode === 'fill' && st.voice) speak(drag.el.dataset.p || drag.el.textContent); }
    drag.c.style.transform = 'translate(' + (x - drag.x0) + 'px,' + (y - drag.y0) + 'px) scale(1.12)';
    const t = targetAt(x, y);
    if (t !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = t; if (t) t.classList.add('over'); }
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp);
    const d = drag; drag = null;
    if (d.over) d.over.classList.remove('over');
    if (!d.moved) { if (e.type === 'pointerup') tapPiece(d.el); return; }
    const t = e.type === 'pointerup' ? targetAt(e.clientX, e.clientY) : null;
    if (!t) return back(d.c, d.el, d.r);
    if (G.q.mode === 'fill') dropFill(d.el.dataset.p, t, d.el, d.c, d.r);
    else dropOrder(d.el, t, d.c, d.r);
  }
  function clearSel() { if (G) G.sel = null; $$('.ptile.sel, .wcard.sel').forEach(x => x.classList.remove('sel')); }
  function tapPiece(el) {
    if (G.q.mode === 'fill') {
      speak(el.dataset.p);
      if (!st.tap) return;
      const open = openSlots();
      if (open.length === 1) { const m = makeClone(el); return dropFill(el.dataset.p, open[0], el, m.c, m.r); }
      clearSel(); G.sel = el.dataset.p; el.classList.add('sel'); return;
    }
    // ならべかえ：あいている いちばん ひだりへ
    if (!st.tap) return;
    const slot = $$('#ansRow .oslot').find(s => !s.firstChild);
    if (slot) { const m = makeClone(el); dropOrder(el, slot, m.c, m.r); }
  }

  /* ---- ならべかえ ---- */
  function renderOrder(q) {
    q.cards.forEach(c => { c.placed = false; });
    q.slots = Array(q.need).fill(null);
    const sayQ = () => speak('カードを ならべて ぶんを つくろう');
    setView('play', [
      topBar('ぶんを つくろう', q.cards.some(c => c.extra) ? 'つかわない カードが まざって いるよ' : 'カードを したの わくに ならべよう', sayQ),
      h('div', { class: 'stage' }, h('div', { class: 'pic' }, q.it.e),
        h('div', { class: 'ans-row', id: 'ansRow' }, q.slots.map((_, i) => h('div', { class: 'oslot', 'data-si': i })))),
      h('div', { class: 'tray', id: 'tray' }, q.deal.map(c => h('button', { type: 'button', class: 'wcard' + (c.part ? ' pc' : ''), 'data-cid': c.cid, style: c.part ? '--c:' + PCOLOR[c.text] : '' }, c.text)))
    ]);
    $('#tray').addEventListener('pointerdown', e => onDown(e, '.wcard'));
    $('#ansRow').addEventListener('click', e => { const s = e.target.closest('.oslot'); if (!s || !s.firstChild || G.busy) return; unplace(+s.dataset.si); });
    if (st.readQ) sayQ();
  }
  function cardById(cid) { return G.q.cards.find(c => c.cid === cid); }
  function dropOrder(el, slotEl, clone, r) {
    const q = G.q, si = +slotEl.dataset.si;
    if (q.slots[si]) unplace(si);
    flyTo(clone, r, slotEl.getBoundingClientRect(), () => {
      const c = cardById(el.dataset.cid); c.placed = true; q.slots[si] = c;
      const pc = h('div', { class: 'wcard' + (c.part ? ' pc' : ''), style: c.part ? '--c:' + PCOLOR[c.text] : '' }, c.text);
      slotEl.innerHTML = ''; slotEl.appendChild(pc);
      sfx.ok(q.slots.filter(Boolean).length); $$('.wcard.hint').forEach(x => x.classList.remove('hint'));
      if (q.slots.every(Boolean)) checkOrder();
    });
  }
  function unplace(si) {
    const q = G.q, c = q.slots[si]; if (!c) return;
    q.slots[si] = null; c.placed = false;
    const s = $$('#ansRow .oslot')[si]; if (s) s.innerHTML = '';

  // じゅんばん：「ことば＋じょし」の まとまりは いれかわっても よい（さいごは うごき）
  function orderOk(q) {
    const s = q.slots;
    if (s.some(c => c.extra)) return false;
    const last = q.cards.filter(c => !c.extra).slice(-1)[0];
    if (s[s.length - 1].text !== last.text) return false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c.pair) { const nx = s[i + 1]; if (!nx || !nx.part || (c.pair.ok || [c.pair.text]).indexOf(nx.text) < 0) return false; }
      if (c.part && !c.extra) { const pv = s[i - 1]; if (!pv || !pv.pair || (pv.pair.ok || [pv.pair.text]).indexOf(c.text) < 0) return false; }
    }
    return true;
  }
  function nextNeeded(q) { const firstEmpty = q.slots.findIndex(x => !x); const want = q.cards.filter(c => !c.extra)[firstEmpty]; return want && !want.placed ? want : q.cards.find(c => !c.extra && !c.placed); }
  function checkOrder() {

  }

  /* ---- ただしい ぶん・かきかた ---- */
  function renderPick(q) {

  /* ---- できた ---- */

    showPraise(praiseWord()); sfx.round();

  }
  function quitBtn() {

    let t = null; const cancel = () => { clearTimeout(t); t = null; b.classList.remove('pressing'); };

  function renderResult(stopped) {

        h('button', { type: 'button', class: 'big-btn blue', onclick: again }, '🔁 もういちど'),

    ]);

  /* ============================================================
     A4 プリント
     ============================================================ */
  const PR_TYPES = [
    { id: 'fillc', mode: 'fill', n: '🧩 あなうめ（○を つける）', d: '（ が ・ を ・ に ）から えらんで ○' },

  const prSt = Object.assign({ type: 'fillc', level: 1, count: 8, answer: true, big: false, pages: 1 }, load('joshi.print') || {});

  function pHead(title, inst, no, all, isAns) {

    } else {

    }

  }
  function buildPrintPages(o) {

    const maxPer = { fillc: 10, fillw: 10, yomi: 10, pick: 6, kaki: 6, order: 6 }[T.id] || 8;
    const per = Math.max(1, Math.min(+o.count || 8, o.big ? Math.ceil(maxPer / 2) : maxPer));
    const qs = makeQs(T.mode, lv, (+o.count || 8) * (+o.pages || 1)).map(q => Object.assign(q, { it_e: q.it ? q.it.e : q.e }));

    const nPages = Math.ceil(qs.length / per);

      const chunk = qs.slice(p * per, p * per + per);
