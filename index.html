  /* ============================================================

  function focusOf(lv) { return st.focus && st.focus.length ? st.focus.slice() : lv.focus; }
  function optsOf(lv) { if (st.focus && st.focus.length) { const f = st.focus.slice(); FALLBACK.forEach(p => { if (f.length < 4 && f.indexOf(p) < 0) f.push(p); }); return f; } return lv.opts; }
  function kOf(lv) { return st.k !== 'auto' ? +st.k : (st.focus && st.focus.length ? Math.min(4, Math.max(2, st.focus.length)) : lv.k); }
  function poolFill(lv) {
    const f = focusOf(lv);

    if (lv.multi || (st.focus && st.focus.length)) pool = pool.concat(multi.filter(it => it.blanks.every(b => f.indexOf(b.ans) >= 0 || (lv.multi && !st.focus.length))));

  // おなじ じょしばかりに ならないように、こたえの じょしごとに じゅんばんに とる

    while (out.length < n && pool.length) out.push(pick(pool));

  function makeQs(mode, lv, n) {

      if (mode === 'pick') pool = pool.filter(it => it.blanks.length === 1);
      if (!pool.length) pool = single.slice();
      return spreadPick(pool, n, it => it.blanks.map(b => b.ans).join()).map(it => {
        if (mode === 'fill') {

          const wrongs = []; it.blanks.forEach(b => choicesFor(b, opts, k).forEach(p => { if (answers.indexOf(p) < 0 && wrongs.indexOf(p) < 0 && !it.blanks.some(bb => bb.ok.indexOf(p) >= 0)) wrongs.push(p); }));
          const need = Math.max(k, answers.length + 1);

        }

      });
    }
    if (mode === 'order') {
      let pool = (lv.multi ? multi : single).filter(it => it.full.indexOf('。') < 0 && chunksOf(it).length >= 3);
      if (st.focus && st.focus.length) { const f = st.focus; const p2 = pool.filter(it => it.blanks.every(b => f.indexOf(b.ans) >= 0)); if (p2.length >= 3) pool = p2; }
      return spreadPick(pool, n, it => it.blanks[0].ans).map(it => {
        const cards = chunksOf(it);
        const used = it.blanks.map(b => b.ans);
        const dpool = shuffle(ALL.filter(p => used.indexOf(p) < 0 && !it.blanks.some(b => b.ok.indexOf(p) >= 0 || (RULES[b.ans] || []).indexOf(p) >= 0 || b.ex.indexOf(p) >= 0) && ['から', 'まで', 'より', 'や'].indexOf(p) < 0));

      const write = wrongSet => { let bi = -1; return it.segs.map(x => { if (x.t === 'x') return x.v; bi++; return wrongSet.indexOf(bi) >= 0 ? YOMI[x.ans] : x.ans; }).join(''); };

      const wr = shuffle(targets);

      if (lv.k >= 3) outs.push({ txt: write(wr.length > 1 ? [wr[1]] : []) === outs[0].txt ? write(wr) : write(wr.length > 1 ? wr : [wr[0]]), ok: false });

  function makeYomi(set, n) {
    const qs = [];
    const fromBank = p => ITEMS.filter(it => it.blanks.length === 1 && it.blanks[0].ans === p && it.full.indexOf('。') < 0).map(it => {
